<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0d1019" />
    <title>Lifemax — wyjdź po więcej</title>
    <style>
      /* 01. Motywy i fundamenty */
      :root {
        color-scheme: dark;
        --bg: #0d1019;
        --panel: #161b28;
        --panel2: #1c2333;
        --text: #f2f4fc;
        --muted: #919bb4;
        --line: #2a3247;
        --lime: #ccff76;
        --purple: #ac95ff;
        --gold: #ffcf73;
        --shadow: #0003;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 system-ui,
          -apple-system,
          sans-serif;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--purple);
        outline-offset: 4px;
      }
      button {
        touch-action: manipulation;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 30px;
        letter-spacing: -1.2px;
        line-height: 1.2;
      }
      h2 {
        font-size: 20px;
        letter-spacing: -0.5px;
      }
      h3 {
        font-size: 16px;
      }
      small,
      .muted {
        color: var(--muted);
      }
      small {
        font-size: 12px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 2px;
        font-weight: 800;
        color: var(--lime);
      }
      .shell {
        max-width: 1060px;
        margin: auto;
        padding: 0 28px 120px;
      }
      header {
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        margin-bottom: 30px;
      }
      .logo {
        font-weight: 900;
        font-size: 25px;
        letter-spacing: -1px;
      }
      .logo b {
        color: var(--lime);
      }
      .logo em {
        font-size: 10px;
        color: var(--muted);
        font-style: normal;
        letter-spacing: 2px;
        display: block;
      }
      .top-right {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 30px;
        padding: 8px 13px;
        font-size: 12px;
        background: var(--panel);
      }
      .avatar {
        height: 38px;
        width: 38px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: var(--lime);
        color: #1b2b12;
        font-weight: 900;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 25px 0 22px;
        gap: 16px;
      }
      .heading p {
        margin-top: 7px;
        color: var(--muted);
        font-size: 13px;
      }
      .pill {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1px;
        border-radius: 6px;
        padding: 5px 8px;
        background: #a995ff18;
        color: var(--purple);
        white-space: nowrap;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 23px;
      }
      .hero {
        position: relative;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 20px;
        background:
          radial-gradient(ellipse at 90% 40%, #9e79ef22, transparent 55%),
          var(--panel);
      }
      .hero:after {
        content: "✦";
        position: absolute;
        right: 30px;
        top: -26px;
        font-size: 185px;
        color: #a995ff0b;
        pointer-events: none;
      }
      .hero h2 {
        margin: 9px 0 4px;
        font-size: 25px;
      }
      .hero .xp-num {
        font-weight: 800;
        font-size: 30px;
        letter-spacing: -1px;
        text-align: right;
      }
      .progress {
        height: 7px;
        border-radius: 9px;
        background: var(--line);
        overflow: hidden;
        margin: 17px 0 9px;
      }
      .progress i {
        height: 100%;
        display: block;
        background: linear-gradient(90deg, var(--purple), var(--lime));
        border-radius: 9px;
        transition: width 0.5s;
      }
      .spread {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      .stats-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 14px 0 28px;
      }
      .stat {
        padding: 17px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .stat strong {
        display: block;
        font-size: 24px;
      }
      .stat small {
        font-size: 11px;
      }
      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 24px 0 15px;
      }
      .ghost {
        background: none;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 11px 14px;
        min-height: 44px;
        font-size: 12px;
      }
      .ghost:hover {
        background: var(--panel2);
      }
      .primary {
        background: var(--lime);
        border: 0;
        border-radius: 12px;
        min-height: 48px;
        padding: 12px 20px;
        color: #233116;
        font-weight: 800;
      }
      .primary:hover {
        filter: brightness(1.08);
      }
      .missions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
      .mission {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 280px;
        transition:
          transform 0.2s,
          border-color 0.2s;
      }
      .mission:hover {
        transform: translateY(-3px);
        border-color: #6f688d;
      }
      .mission .icon {
        width: 46px;
        height: 46px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        font-size: 24px;
        background: var(--panel2);
        margin-bottom: 20px;
      }
      .mission .difficulty {
        position: absolute;
        right: 20px;
        top: 25px;
        font-size: 10px;
        letter-spacing: 1px;
        font-weight: 800;
      }
      .mission h3 {
        font-size: 18px;
        margin: 7px 0 10px;
        line-height: 1.35;
      }
      .mission p {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 20px;
      }
      .mission footer {
        margin-top: auto;
      }
      .complete {
        border: 1px solid #ccff7644;
        background: #ccff7608;
      }
      .complete .primary {
        background: var(--panel2);
        color: var(--lime);
      }
      .mission.done-animation {
        animation: complete 0.6s;
      }
      .category {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--muted);
      }
      .reward {
        display: flex;
        justify-content: space-between;
        margin: 4px 0 18px;
        font-size: 12px;
      }
      .reward b {
        color: var(--lime);
      }
      .mission button {
        width: 100%;
      }
      .daily-note {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        margin: 18px 0;
      }
      .chest-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .chest-symbol {
        font-size: 38px;
      }
      .chest-row .primary {
        margin-left: auto;
      }
      .chests {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      .chests button {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        min-height: 48px;
      }
      .inventory-tools {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .inventory-tools select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        min-height: 44px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }
      .item {
        --rarity: #9ba7bc;
        position: relative;
        min-height: 146px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        padding: 16px 9px;
        text-align: center;
        overflow: hidden;
      }
      .item.owned {
        border-color: color-mix(in srgb, var(--rarity) 45%, var(--line));
        background:
          radial-gradient(
            ellipse at top,
            color-mix(in srgb, var(--rarity) 10%, transparent),
            transparent 80%
          ),
          var(--panel);
        box-shadow: inset 0 0 25px
          color-mix(in srgb, var(--rarity) 5%, transparent);
      }
      .item .art {
        font-size: 35px;
        display: block;
        margin-bottom: 10px;
        filter: drop-shadow(
          0 0 10px color-mix(in srgb, var(--rarity) 35%, transparent)
        );
      }
      .item .name {
        font-size: 11px;
        font-weight: 700;
        display: block;
        line-height: 1.3;
        min-height: 29px;
      }
      .item .rarity {
        display: block;
        font-size: 9px;
        color: var(--rarity);
        margin-top: 7px;
      }
      .item.locked .art {
        filter: grayscale(1) brightness(0.25);
        opacity: 0.5;
      }
      .item.locked .name {
        color: var(--muted);
      }
      .mythic.owned:after {
        content: "";
        position: absolute;
        inset: -100%;
        background: linear-gradient(
          110deg,
          transparent 40%,
          #ee74ff25,
          #80f7ff20,
          #fff78a25,
          transparent 60%
        );
        animation: shimmer 5s linear infinite;
        pointer-events: none;
      }
      .set-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 18px;
      }
      .set-card {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--panel);
      }
      .set-card p {
        font-size: 12px;
        color: var(--muted);
        margin: 5px 0;
      }
      .set-card .progress {
        margin: 10px 0 0;
        height: 4px;
      }
      .badges {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .badge {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 18px;
        border-radius: 15px;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .badge > span {
        font-size: 27px;
      }
      .badge:not(.earned) > span {
        filter: grayscale(1);
        opacity: 0.35;
      }
      .badge small {
        display: block;
        font-size: 11px;
        margin-top: 4px;
      }
      .badge.earned {
        border-color: #ffcf7344;
      }
      .badge b {
        font-size: 12px;
      }
      .map-wrap {
        background:
          radial-gradient(ellipse, #ac95ff0d, transparent), var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 12px;
      }
      .map-wrap svg {
        display: block;
        width: 100%;
        max-height: 470px;
        touch-action: manipulation;
      }
      .hex {
        cursor: pointer;
        stroke: var(--bg);
        stroke-width: 3;
        fill: var(--panel2);
      }
      .hex.revealed {
        fill: #648c54;
        stroke: #b6f67555;
      }
      .hex.selected {
        stroke: var(--gold);
        stroke-width: 4;
      }
      .hex:focus {
        stroke: var(--purple);
        outline: none;
      }
      .map-detail {
        margin-top: 14px;
      }
      .map-detail label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      input,
      textarea {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        padding: 12px;
        width: 100%;
        min-height: 46px;
      }
      textarea {
        resize: vertical;
        min-height: 90px;
      }
      .map-detail button {
        margin-top: 12px;
      }
      .flex-card {
        position: relative;
        max-width: 580px;
        margin: 0 auto;
        padding: 30px;
        background:
          radial-gradient(ellipse at 95% 0, #ac95ff25, transparent 65%),
          linear-gradient(145deg, #1e2739, #111722);
        border: 1px solid #6b5f894d;
        border-radius: 24px;
        color: #f2f4fc;
        overflow: hidden;
        box-shadow: 0 20px 60px #0002;
      }
      .flex-card .muted,
      .flex-card small {
        color: #99a8c3;
      }
      .flex-card .avatar {
        width: 62px;
        height: 62px;
        font-size: 25px;
        border-radius: 20px;
      }
      .profile-name {
        font-size: 25px;
        letter-spacing: -1px;
      }
      .rank {
        font-size: 11px;
        font-weight: 800;
      }
      .cp-display {
        font-size: 68px;
        font-weight: 900;
        letter-spacing: -4px;
        line-height: 1.1;
        margin-top: 24px;
      }
      .cp-display span {
        font-size: 16px;
        letter-spacing: 0;
        color: #9eacc6;
      }
      .flex-stats {
        display: flex;
        gap: 25px;
        border-bottom: 1px solid #ffffff18;
        padding: 20px 0;
        margin-bottom: 20px;
      }
      .flex-stats b {
        display: block;
        font-size: 20px;
      }
      .showcase {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 12px 0 25px;
      }
      .showcase .item {
        min-height: 125px;
        background: #ffffff04;
        border-color: #ffffff20;
        color: #f2f4fc;
      }
      .showcase .empty {
        display: grid;
        place-items: center;
        font-size: 28px;
        color: #6e7e9d;
      }
      .profile-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 20px 0;
      }
      .edit-panel {
        max-width: 580px;
        margin: 18px auto;
      }
      .choose-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }
      .choose-grid button {
        font-size: 25px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel2);
        padding: 10px;
        min-width: 48px;
        min-height: 48px;
      }
      .choose-grid button.selected {
        border-color: var(--lime);
        background: #ccff7615;
      }
      .danger-button {
        color: #ff9eac;
        border-color: #ff9eac40;
      }
      .nav {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: min(610px, calc(100% - 24px));
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        border: 1px solid var(--line);
        border-radius: 20px;
        display: flex;
        padding: 8px;
        z-index: 20;
        box-shadow: 0 15px 45px #0005;
        backdrop-filter: blur(16px);
      }
      .nav button {
        flex: 1;
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 10px;
        border-radius: 13px;
        padding: 8px 3px;
        min-height: 56px;
      }
      .nav button span {
        font-size: 21px;
        display: block;
        line-height: 1.3;
        margin-bottom: 4px;
      }
      .nav button.active {
        background: #ac95ff15;
        color: var(--purple);
      }
      .toast {
        position: fixed;
        bottom: 110px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 30px);
        width: max-content;
        background: var(--text);
        color: var(--bg);
        padding: 13px 20px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 700;
        z-index: 100;
        box-shadow: 0 10px 35px #0004;
      }
      dialog {
        width: min(440px, calc(100% - 30px));
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 28px;
        max-height: 85dvh;
        overflow: auto;
      }
      dialog::backdrop {
        background: #060914ce;
        backdrop-filter: blur(8px);
      }
      .dialog-close {
        float: right;
        background: var(--panel2);
        border: 0;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        font-size: 23px;
      }
      .loot-modal {
        text-align: center;
      }
      .loot-modal h2 {
        margin: 20px 0 8px;
      }
      .loot-art {
        font-size: 85px;
        margin: 25px 0;
        filter: drop-shadow(0 0 24px var(--rarity, #ffcf7366));
      }
      .loot-art.shake {
        animation: shake 0.12s infinite;
      }
      .loot-art.flash {
        animation: flash 0.6s;
      }
      .loot-modal .primary {
        width: 100%;
        margin-top: 22px;
      }
      .odds {
        font-size: 11px;
        color: var(--muted);
        margin-top: 14px;
        line-height: 1.8;
      }
      .confetti {
        position: fixed;
        pointer-events: none;
        width: 8px;
        height: 13px;
        top: -20px;
        z-index: 200;
        animation: fall 1.5s ease-in forwards;
      }
      .storage-warning {
        background: #ffcf7318;
        border: 1px solid #ffcf7355;
        border-radius: 12px;
        padding: 12px;
        color: var(--gold);
        font-size: 12px;
        margin-bottom: 18px;
      }
      .footer-note {
        text-align: center;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 1px;
        margin: 30px 0;
      }
      .help {
        margin: 30px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .help summary {
        cursor: pointer;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      .help p {
        margin: 10px 0;
      }
      [hidden] {
        display: none !important;
      }
      @keyframes shake {
        0%,
        100% {
          transform: rotate(-7deg) translateX(-4px);
        }
        50% {
          transform: rotate(7deg) translateX(4px);
        }
      }
      @keyframes flash {
        0% {
          transform: scale(0.5);
          filter: brightness(4);
        }
        70% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes complete {
        50% {
          box-shadow: 0 0 40px #ccff7644;
        }
      }
      @keyframes shimmer {
        from {
          transform: translateX(-30%) rotate(15deg);
        }
        to {
          transform: translateX(30%) rotate(15deg);
        }
      }
      @keyframes fall {
        to {
          transform: translate(var(--dx), 105vh) rotate(600deg);
          opacity: 0;
        }
      }
      /* 02. Responsywność i jasny motyw */
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f4f5fa;
          --panel: #fff;
          --panel2: #edf0f7;
          --text: #20283d;
          --muted: #68748c;
          --line: #dce1ec;
          --lime: #528b20;
          --purple: #7454c2;
          --gold: #9a6917;
        }
        .primary {
          background: #cdf88e;
          color: #233116;
        }
        .hex.revealed {
          fill: #a1c788;
        }
        .nav button.active {
          background: #ac95ff20;
        }
        .eyebrow {
          color: #6b4cba;
        }
        .flex-card .eyebrow {
          color: #ccff76;
        }
        .toast {
          background: #25314b;
          color: white;
        }
      }
      @media (max-width: 700px) {
        .shell {
          padding: 0 18px 110px;
        }
        header {
          height: 76px;
          margin-bottom: 23px;
        }
        .logo {
          font-size: 24px;
        }
        .heading {
          margin-top: 18px;
        }
        h1 {
          font-size: 26px;
        }
        .missions {
          grid-template-columns: 1fr;
        }
        .mission {
          min-height: 0;
          padding: 20px;
        }
        .mission .icon {
          float: left;
          margin-bottom: 12px;
        }
        .mission h3 {
          font-size: 18px;
        }
        .mission footer {
          display: flex;
          align-items: center;
          gap: 15px;
        }
        .reward {
          flex: 1;
          margin: 0;
          flex-direction: column;
          gap: 3px;
        }
        .mission button {
          width: auto;
          min-width: 130px;
        }
        .mission p {
          margin-bottom: 20px;
        }
        .stats-row {
          gap: 8px;
          margin-bottom: 22px;
        }
        .stat {
          padding: 13px 11px;
        }
        .stat strong {
          font-size: 21px;
        }
        .stat small {
          font-size: 10px;
        }
        .hero {
          padding: 20px;
        }
        .hero h2 {
          font-size: 22px;
        }
        .hero .xp-num {
          font-size: 25px;
        }
        .grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 9px;
        }
        .item {
          padding: 14px 6px;
          min-height: 141px;
        }

              .map((id) => {
                const i = itemById(id);
                return `<button type="button" data-showcase="${id}" title="${i.name}" aria-label="${i.name}" aria-pressed="${state.showcase.includes(id)}" class="${state.showcase.includes(id) ? "selected" : ""}">${i.icon}</button>`;
              })
              .join("") ||
            "<small>Najpierw otwórz skrzynię, aby zdobyć trofeum.</small>"
          }</div><button class="primary">Zapisz nick</button></form></section><div class="panel edit-panel"><h3>Skąd biorą się CP?</h3><p class="muted" style="font-size:12px;margin-top:8px">${state.xp} XP + ${state.owned.reduce((n, id) => n + RARITIES[itemById(id).rarity].value, 0)} za unikalne przedmioty + ${completeSets().reduce((n, s) => n + s.bonus, 0)} za zestawy + ${BADGES.filter((b) => state.badges.includes(b.id)).reduce((n, b) => n + b.bonus, 0)} za odznaki. Duplikaty dają pył, nie dodatkową wartość przedmiotu.</p><p class="muted" style="font-size:11px;margin-top:10px">Rangi: Brąz 0 · Srebro 300 · Złoto 1000 · Diament 2500 · Mityczny 5000 CP.</p></div><div class="profile-actions"><button class="ghost danger-button" id="reset">Wyzeruj wszystkie postępy</button></div><details class="help"><summary>Jak dodawać własne treści?</summary><p><b>Misje:</b> dopisz parę [tytuł, opis] w MISSION_TEXTS. Trzy tablice to poziomy trudności 10/25/50 XP; kategorie przypisuje Math.floor(i/4). Dla większych baz możesz dopisywać obiekty bezpośrednio do MISSIONS z unikalnym id, difficulty 0–2, category, title, description i xp.</p><p><b>Przedmioty:</b> dodaj obiekt do ITEMS z unikalnym id, set (id zestawu), rarity 0–4, name, icon i lore. Nowy zestaw dodaj do SETS z id, name, icon i bonus. Nie zmieniaj istniejących identyfikatorów, bo są używane w zapisie.</p><p><b>Odznaki:</b> dodaj do BADGES obiekt z id, name, icon, hint, bonus i funkcją test(s), która sprawdza stan. XP, CP, dropy i bonusy skonfigurujesz w LEVELS, RANKS, RARITIES i CHESTS. Wszystko znajduje się w tym jednym pliku HTML.</p></details>`
        );
      }
      function render() {
        ensureDay();
        $("storageWarning").hidden = storageOK;
        $("headerStreak").textContent = `🔥 ${state.streak} dni`;
        $("avatar").textContent = state.nick[0].toUpperCase();
        $("content").innerHTML = {
          missions: missionsView,
          map: mapView,
          collection: collectionView,
          badges: badgesView,
          profile: profileView,
        }[tab]();
        document.querySelectorAll("[data-tab]").forEach((b) => {
          b.classList.toggle("active", b.dataset.tab === tab);
          b.setAttribute(
            "aria-current",
            b.dataset.tab === tab ? "page" : "false",
          );
        });
        bindView();
        updateCountdown();
      }
      /* 09. Interakcje, dialogi i bezpieczne kopiowanie */
      function showModal(html) {
        $("modal").innerHTML =
          `<button class="dialog-close" id="closeModal" aria-label="Zamknij">×</button>${html}`;
        $("closeModal").onclick = closeModal;
        if (!$("modal").open) $("modal").showModal();
      }
      function closeModal() {
        if (opening) return;
        $("modal").close();
      }
      $("modal").addEventListener("cancel", (e) => {
        if (opening) e.preventDefault();
      });
      function showItem(id) {
        const item = itemById(id),
          owned = state.owned.includes(id),
          r = RARITIES[item.rarity];
        showModal(
          `<div class="loot-modal" style="--rarity:${r.color}"><div class="loot-art" style="${owned ? "" : "filter:grayscale(1) brightness(.3)"}">${item.icon}</div><div class="eyebrow" style="color:${r.color}">${r.name}</div><h2>${owned ? item.name : "Nieodkryty przedmiot"}</h2><p class="muted">${owned ? item.lore : "Ukrywa się w skrzyniach. Każda misja to kolejna szansa."}</p><p class="muted" style="margin-top:14px">Zestaw ${SETS.find((s) => s.id === item.set).name} · ${r.value} CP</p></div>`,
        );
      }
      async function copyResult() {
        const text = `✦ LIFEMAX | ${state.nick}\n◆ ${rank().name} · ${cp()} CP · ${level().name}\n🔥 Seria: ${state.streak} dni | ⬡ Odkryte pola: ${state.tiles.length}\n◈ Kolekcja: ${state.owned.length}/${ITEMS.length} | Misje: ${state.completed}\n${state.showcase.map((id) => itemById(id).icon + " " + itemById(id).name).join(" · ")}\nMniej scrollowania. Więcej historii.`;
        try {
          if (!navigator.clipboard?.writeText) throw new Error();
          await navigator.clipboard.writeText(text);
          notify("Wynik skopiowany. Czas na mały flex!");
        } catch {
          showModal(
            `<h2 style="margin-top:12px">Twój wynik do skopiowania</h2><p class="muted" style="font-size:12px;margin:14px 0">Przeglądarka nie udostępniła schowka. Zaznacz tekst i skopiuj ręcznie.</p><textarea id="copyFallback" readonly style="height:210px">${esc(text)}</textarea>`,
          );
          $("copyFallback").focus();
          $("copyFallback").select();
        }
      }
      function bindView() {
        document
          .querySelectorAll("[data-complete]")
          .forEach(
            (b) =>
              (b.onclick = () => finishMission(Number(b.dataset.complete))),
          );
        if ($("reroll")) $("reroll").onclick = reroll;
        document
          .querySelectorAll("[data-chest]")
          .forEach(
            (b) => (b.onclick = () => chestDialog(Number(b.dataset.chest))),
          );
        document
          .querySelectorAll("[data-exchange]")
          .forEach(
            (b) => (b.onclick = () => exchange(Number(b.dataset.exchange))),
          );
        document
          .querySelectorAll("[data-item]")
          .forEach((b) => (b.onclick = () => showItem(b.dataset.item)));
        document.querySelectorAll("[data-tile]").forEach((b) => {
          const action = () => {
            const i = Number(b.dataset.tile);
            if (i >= state.tiles.length) {
              notify("To pole jest we mgle. Odkryjesz je, zaliczając misję.");
              return;
            }
            selectedTile = i;
            render();
          };
          b.onclick = action;
          b.onkeydown = (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              action();
            }
          };
        });
        if ($("mapForm"))
          $("mapForm").onsubmit = (e) => {
            e.preventDefault();
            const t = state.tiles[selectedTile];
            t.name = $("placeName").value.trim();
            t.note = $("placeNote").value.trim();
            awardBadges();
            save();
            render();
            notify("Wspomnienie zapisane");
          };
        if ($("copyResult")) $("copyResult").onclick = copyResult;
        if ($("editProfile"))
          $("editProfile").onclick = () => {
            $("profileEditor").hidden = !$("profileEditor").hidden;
            if (!$("profileEditor").hidden) $("nickname").focus();
          };
        if ($("profileForm"))
          $("profileForm").onsubmit = (e) => {
            e.preventDefault();
            const nick = $("nickname").value.trim();
            if (!nick) {
              $("nickname").setCustomValidity("Wpisz nick, nie same spacje.");
              $("nickname").reportValidity();
              return;
            }
            state.nick = nick.slice(0, 24);
            save();
            render();
            notify("Karta zaktualizowana");
          };
        if ($("nickname"))
          $("nickname").oninput = () => $("nickname").setCustomValidity("");
        document.querySelectorAll("[data-showcase]").forEach(
          (b) =>
            (b.onclick = () => {
              const id = b.dataset.showcase;
              if (state.showcase.includes(id))
                state.showcase = state.showcase.filter((x) => x !== id);
              else if (state.showcase.length < 3) state.showcase.push(id);
              else {
                notify(
                  "Na wystawie mieszczą się 3 trofea. Najpierw odznacz jedno.",
                );
                return;
              }
              save();
              b.classList.toggle("selected", state.showcase.includes(id));
              b.setAttribute(
                "aria-pressed",
                String(state.showcase.includes(id)),
              );
              const oldNick = $("nickname").value;
              const editorOpen = !$("profileEditor").hidden;
              render();
              $("profileEditor").hidden = !editorOpen;
              $("nickname").value = oldNick;
            }),
        );
        if ($("reset"))
          $("reset").onclick = () => {
            showModal(
              '<h2 style="margin-top:18px">Zacząć od nowa?</h2><p class="muted" style="margin:15px 0">Usuniesz XP, kolekcję, skrzynie, mapę i wszystkie odznaki z tej przeglądarki. Tej operacji nie można cofnąć.</p><div class="profile-actions"><button class="ghost" id="cancelReset">Zachowaj postępy</button><button class="primary" id="confirmReset">Tak, usuń wszystko</button></div>',
            );
            $("cancelReset").onclick = closeModal;
            $("confirmReset").onclick = () => {
              state = fresh();
              selectedTile = 0;
              filter = "all";
              ensureDay();
              save();
              closeModal();
              tab = "missions";
              render();
              notify("Czysta karta. Nowa przygoda czeka.");
            };
          };
      }
      function navigate(next) {
        tab = next;
        render();
        window.scrollTo({ top: 0, behavior: "instant" });
      }
      document
        .querySelectorAll("[data-tab]")
        .forEach((b) => (b.onclick = () => navigate(b.dataset.tab)));
      $("avatar").onclick = () => navigate("profile");
      /* 10. Zegar: lokalna północ, również po powrocie do karty */
      function updateCountdown() {
        if (!$("countdown")) return;
        const now = new Date(),
          midnight = new Date(now);
        midnight.setHours(24, 0, 0, 0);
        const s = Math.max(0, Math.floor((midnight - now) / 1000));
        $("countdown").textContent =
          `${String(Math.floor(s / 3600)).padStart(2, "0")}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
      }
      setInterval(() => {
        if (ensureDay()) render();
        else updateCountdown();
      }, 1000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          ensureDay();
          render();
        }
      });
      ensureDay();
      awardBadges();
      save();
      render();
    </script>
  </body>
</html>
